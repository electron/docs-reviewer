apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: server
    count: 1
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: docs-reviewer.electronjs.org
  # Probot serves GET /ping -> "PONG"; APP_ID, PRIVATE_KEY and WEBHOOK_SECRET
  # come from the server-secrets ExternalSecret.
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /ping
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /ping
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: LOG_LEVEL, value: info }
